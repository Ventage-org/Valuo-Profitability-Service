# Server Configuration
server.port=8084

# Application Configuration
spring.application.name=valuo-profitability-service

# PostgreSQL Database Configuration
# Base de datos: db_operacional_valuo, Schema: profitability
spring.datasource.url=jdbc:postgresql://localhost:5432/db_operacional_valuo?currentSchema=profitability
spring.datasource.username=postgres
spring.datasource.password=5432
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=profitability
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Outbound Microservices (Predicciones - msPrediccion)
services.predictions.base-url=http://localhost:8083
services.predictions.connect-timeout-seconds=3
services.predictions.read-timeout-seconds=5

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
