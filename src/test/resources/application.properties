spring.datasource.url=jdbc:h2:mem:profitability_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS profitability
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

services.predictions.base-url=http://localhost:8083
services.predictions.connect-timeout-seconds=1
services.predictions.read-timeout-seconds=1
